// Siro Maps for Android: an API compatible with the Google Maps SDK for Android, on Siro's engine. Not affiliated with Google.
//
// Apps move from com.google.android.gms.maps to com.siro.maps by changing the
// imports; the classes and methods keep the same names and signatures.
plugins {
    id 'com.android.library' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.4.10'
    id 'com.vanniktech.maven.publish' version '0.37.0'
    id 'signing'
}

android {
    namespace 'com.siro.maps'
    compileSdk 36

    defaultConfig {
        // The engine's manifest requires 23, so the SDK cannot go lower.
        minSdk 23
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

}

dependencies {
    // The Siro engine: our MapLibre Native fork, published under the same Maven Central namespace.
    api 'io.github.hamza-ayed.siro:siro-native-android-opengl-debug:13.7.1-siro.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.9'

    testImplementation 'junit:junit:4.13.2'
}

// Sign with the local GPG key. The key name and passphrase come from ~/.gradle/gradle.properties.
signing {
    useGpgCmd()
}

// Maven coordinates: io.github.hamza-ayed.siro:siro-maps-android.
// Local check: ./gradlew publishToMavenLocal
// Maven Central (needs a Central token and a GPG key, see docs/PUBLISHING_PLAN_AR.md):
//   ./gradlew publishToMavenCentral
mavenPublishing {
    configure(new com.vanniktech.maven.publish.AndroidSingleVariantLibrary('release', true, true))
    publishToMavenCentral()
    // Sign only when a GPG key is configured, so the local publish runs without one.
    if (findProperty('signingInMemoryKey') || findProperty('signing.gnupg.keyName')) {
        signAllPublications()
    }
    coordinates('io.github.hamza-ayed.siro', 'siro-maps-android', '1.0.0-beta.1')

    pom {
        name = 'Siro Maps for Android'
        description = 'An API compatible with the Google Maps SDK for Android, on Siro\'s MapLibre engine. Not affiliated with Google.'
        url = 'https://github.com/Hamza-Ayed/siro_map_engine'
        licenses {
            license {
                name = 'BSD-3-Clause'
                url = 'https://opensource.org/licenses/BSD-3-Clause'
            }
        }
        developers {
            developer {
                id = 'hamza-ayed'
                name = 'Hamza Ayed'
            }
        }
        scm {
            url = 'https://github.com/Hamza-Ayed/siro_map_engine'
            connection = 'scm:git:https://github.com/Hamza-Ayed/siro_map_engine.git'
            developerConnection = 'scm:git:ssh://git@github.com/Hamza-Ayed/siro_map_engine.git'
        }
    }
}
