// The sample app. It uses the SDK exactly as a Google Maps app would, so it doubles as
// the check that the API behaves the same.
// Versions come from the root build.gradle, which puts these plugins on the classpath.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.siro.maps.example'
    compileSdk 36

    defaultConfig {
        applicationId 'com.siro.maps.example'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {
    implementation project(':')
    implementation 'androidx.fragment:fragment-ktx:1.8.9'
}
