name: siro_gl_web
description: Web platform implementation of maplibre_gl. This package is only intended to be used by the siro_gl package.
version: 1.0.0-beta.1
repository: https://github.com/Hamza-Ayed/siro_map_engine
issue_tracker: https://github.com/Hamza-Ayed/siro_map_engine/issues
resolution: workspace

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: '>=3.29.0'

flutter:
  plugin:
    platforms:
      web:
        pluginClass: SiroMapPlugin
        fileName: siro_gl_web.dart

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  image: ^4.8.0
  meta: ^1.16.0
  siro_gl_platform_interface: ^1.0.0-beta.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0

platforms:
  web:
