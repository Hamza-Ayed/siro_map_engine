name: siro_gl_workspace
publish_to: 'none'
repository: https://github.com/Hamza-Ayed/siro_map_engine
issue_tracker: https://github.com/Hamza-Ayed/siro_map_engine/issues

environment:
  sdk: '>=3.7.0 <4.0.0'

dev_dependencies:
  melos: ^7.4.0
  very_good_analysis: ^11.0.0

workspace:
  - siro_gl_codegen
  - siro_gl
  - siro_gl_web
  - siro_gl_example
  - siro_gl_platform_interface
  - siro_gl_compat

melos:
  scripts:
    generate:
      description: Generate layer & source properties
      exec: dart run lib/generate.dart
      packageFilters:
        scope: siro_gl_codegen

    check-style-spec:
      description: Verify input/style.json matches the pinned upstream MapLibre style spec
      exec: dart run lib/check_style_spec.dart
      packageFilters:
        scope: siro_gl_codegen

    update-style-spec:
      description: Re-download input/style.json from the latest upstream style spec release
      exec: dart run lib/check_style_spec.dart --update
      packageFilters:
        scope: siro_gl_codegen

    test:
      description: Run all tests
      run: |
        set -e
        melos run test:io
        melos run test:web
        melos run test:scripts

    test:scripts:
      description: Run the code generator tests
      exec: dart test
      packageFilters:
        scope: siro_gl_codegen

    test:io:
      description: Run IO tests
      exec: flutter test
      packageFilters:
        scope:
          - siro_gl_platform_interface
          - siro_gl

    test:io:coverage:
      description: Run IO tests with coverage
      exec: flutter test --coverage
      packageFilters:
        scope:
          - siro_gl_platform_interface
          - siro_gl

    test:web:
      description: Run Web tests
      exec: flutter test --platform chrome
      packageFilters:
        scope:
          - siro_gl_platform_interface
          - siro_gl
          - siro_gl_web

    analyze-all:
      description: Run static analysis on all packages
      run: |
        melos exec --concurrency 10 -- "dart analyze --fatal-warnings --fatal-infos"

    format-all:
      description: Format all packages
      exec: dart format --set-exit-if-changed .

    fix-all:
      run: |
        melos exec --concurrency 10 -- "dart fix --apply"
        melos exec --concurrency 10 -- "dart format -o write ."
